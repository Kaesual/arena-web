//
// arena-web's own default configuration for the offline vertical slice.
//
// The engine requires a readable default.cfg in the active game directory and
// stops with a fatal error without one (ioq3 code/qcommon/files.c
// FS_InitFilesystem). That requirement belongs to the engine, not to the game
// modules, so the audited content pack — which is the closure of what the
// pinned baseq3 QVM sources reference — does not contain it. This file is the
// product's answer: original arena-web configuration for an
// arena-web-named game directory, not a copy of anyone else's default.cfg and
// not an addition to the audited pack.
//
// Every command bound below is ioquake3's own: the movement, look and button
// commands of code/client/cl_input.c, the scoreboard and zoom commands of
// code/cgame/cg_consolecmds.c, the console and chat commands of
// code/client/cl_console.c, the screenshot command of
// code/renderergl2/tr_init.c, and the key names of code/client/cl_keys.c.
//
// The profile's own cvars are applied after this file is executed
// (code/qcommon/common.c: Com_ExecuteCfg then Com_StartupVariable), so nothing
// here can override the loader's command line.

unbindall

// Movement. WASD rather than Quake III's arrow-key defaults, because the slice
// is played with one hand on the keyboard and one on the mouse.
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind c "+movedown"
bind SHIFT "+speed"

// Looking. Mouse look is always on; the arrow keys stay usable as a fallback
// while the pointer is not captured.
bind UPARROW "+forward"
bind DOWNARROW "+back"
bind LEFTARROW "+left"
bind RIGHTARROW "+right"

// Combat.
bind MOUSE1 "+attack"
bind MOUSE2 "+zoom"
bind MOUSE3 "+moveup"
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"
bind q "weapprev"
bind e "weapnext"
bind f "+button2"

bind 1 "weapon 1"
bind 2 "weapon 2"
bind 3 "weapon 3"
bind 4 "weapon 4"
bind 5 "weapon 5"
bind 6 "weapon 6"
bind 7 "weapon 7"
bind 8 "weapon 8"
bind 9 "weapon 9"

// Session.
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind t "messagemode"
bind F11 "screenshot"

// The console key is deliberately not bound. ioquake3 handles K_CONSOLE — and
// Shift+Escape — before the binding table is consulted, so that the user can
// never unbind the console (code/client/cl_keys.c:1261). A "bind ~
// toggleconsole" here would be dead configuration that reads as if it did
// something.

// Input feel. Mouse look is permanent, so the look-spring and centring
// behaviour of a keyboard-only client is switched off.
seta in_mouse "1"
seta cl_freelook "1"
seta cl_run "1"
seta m_pitch "0.022"
seta m_yaw "0.022"
seta sensitivity "5"

// Sound. The engine starts muted until the page has audio activation, which
// the loader guarantees by booting only after a user gesture.
seta s_volume "0.7"
seta s_musicvolume "0.25"

// No microphone. S_AL_Init opens an OpenAL capture device whenever
// s_alCapture is set, which it is by default, and it reads only that cvar and
// cl_useMumble (ioq3 code/client/snd_openal.c: the Cvar_Get is inside
// USE_VOIP but outside any cl_voip test). Under Emscripten that path calls
// getUserMedia, so every launch asked the player for microphone access for a
// device the product never records from. Turning cl_voip off -- which the
// relay profile does -- does not reach this; the capture cvar is what does.
// It belongs here rather than in a profile because it is true of both
// profiles, and because a client cvar in native/server-profile.json would
// move a bound the source-contract gate derives from that set.
seta s_alCapture "0"

+mlook
