//
// arena-web's own default configuration for the native dedicated server.
//
// The engine requires a readable default.cfg in the active game directory and
// stops with a fatal error without one (ioq3 code/qcommon/files.c
// FS_InitFilesystem). That requirement belongs to the engine rather than to the
// game modules, so the audited content pack — the closure of what the pinned
// baseq3 QVM sources reference — does not contain one.
//
// This is deliberately not arena/default.cfg. That file is the *client's*
// answer to the same engine requirement and is almost entirely key bindings;
// a dedicated build registers none of those commands (code/client/cl_keys.c is
// not compiled into it), so executing it on a server would print a screenful of
// unknown commands and configure nothing.
//
// Everything the profile decides — game type, map, limits, bots, port — is
// applied from the command line, which Com_StartupVariable re-applies after
// this file is executed (code/qcommon/common.c). Nothing here can override it.

// The census wants a full snapshot cadence rather than a hand-tuned one:
// 20 Hz is the engine's own default (code/server/sv_main.c) and is written
// here so the recorded rate is a stated value rather than an inherited one.
set sv_fps "20"

// A public server list is an explicit WP5 non-goal, and "dedicated 1" already
// keeps SV_MasterHeartbeat from running. Emptying the master addresses as well
// means the property does not depend on one cvar staying as the profile sets it.
set sv_master1 ""
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""

// The prototype's server is not administered over the network.
set rconPassword ""
set sv_privatePassword ""
set g_password ""

// Leave the reconnect throttle at the engine default (3 seconds). The census
// reconnects deliberately, and the wait is part of what it observes.
set sv_reconnectlimit "3"
